name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 GitHub 网页上手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platforms;android-35 build-tools;35.0.0'

      - name: 安装 npm 依赖
        run: npm install

      - name: 生成 Android 项目
        run: npx expo prebuild --platform android --clean

      - name: 打印当前版本配置（便于排查）
        run: |
          echo "=== build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== app/build.gradle 前30行 ==="
          head -30 android/app/build.gradle

      - name: 修复 Gradle 版本兼容性
        run: |
          # 锁定 AGP 8.3.0 + Gradle 8.6（兼容 Expo SDK 52 / RN 0.76）
          sed -i 's|com.android.tools.build:gradle:.*|com.android.tools.build:gradle:8.3.0"|' android/build.gradle
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== 修复后的 build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== 修复后的 gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: 编译 APK
        run: cd android && ./gradlew assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI食物识别助手-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
