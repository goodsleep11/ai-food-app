name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platforms;android-35 build-tools;35.0.0'

      - name: 安装 npm 依赖
        run: npm install

      - name: 生成 Android 原生项目
        run: npx expo prebuild --platform android --clean

      - name: 修复 Gradle 兼容性
        run: node scripts/fix-gradle.js

      - name: 生成签名密钥
        run: |
          rm -f android/app/debug.keystore
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=AI-Food,C=CN" \
            -noprompt

      - name: 编译 Release APK
        run: cd android && ./gradlew assembleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 输出 APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AI食物识别助手.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI食物识别助手-APK
          path: AI食物识别助手.apk
